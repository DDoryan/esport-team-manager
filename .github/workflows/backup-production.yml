name: Sauvegarder quotidiennement la production

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Sauvegarder PostgreSQL et les images privees
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RAILWAY_SSH_PRIVATE_KEY_BASE64: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verifier les secrets requis
        shell: bash
        run: |
          missing_secret=false

          for secret_name in RAILWAY_TOKEN BACKUP_ENCRYPTION_PASSWORD RAILWAY_SSH_PRIVATE_KEY_BASE64; do
            if [ -z "${!secret_name:-}" ]; then
              printf 'Le secret %s est absent.\n' "$secret_name"
              missing_secret=true
            fi
          done

          if [ "$missing_secret" = true ]; then
            exit 1
          fi

      - name: Preparer les metadonnees
        id: metadata
        shell: bash
        run: |
          backup_id="$(date -u '+%Y%m%dT%H%M%SZ')"
          backup_directory="$RUNNER_TEMP/production-backup-$backup_id"

          mkdir -p "$backup_directory"

          {
            printf 'backup_id=%s\n' "$backup_id"
            printf 'backup_directory=%s\n' "$backup_directory"
          } >> "$GITHUB_OUTPUT"

      - name: Sauvegarder PostgreSQL
        shell: bash
        run: |
          backup_directory="${{ steps.metadata.outputs.backup_directory }}"

          npx --yes @railway/cli@latest run \
            --service Postgres \
            --environment production \
            -- docker run --rm \
              --env DATABASE_PUBLIC_URL \
              --volume "$backup_directory:/backup" \
              postgres:18 \
              sh -c "pg_dump \"\$DATABASE_PUBLIC_URL\" --format=custom --no-owner --no-privileges --file=/backup/production.dump"

      - name: Verifier le dump PostgreSQL
        shell: bash
        run: |
          backup_directory="${{ steps.metadata.outputs.backup_directory }}"

          docker run --rm \
            --volume "$backup_directory:/backup:ro" \
            postgres:18 \
            pg_restore --list /backup/production.dump > /dev/null

      - name: Sauvegarder les images privees
        id: private_images
        shell: bash
        run: |
          backup_directory="${{ steps.metadata.outputs.backup_directory }}"
          private_image_root="/app/App_Data/private-images"
          local_image_root="$backup_directory/private-images"
          railway_ssh_key="$HOME/.ssh/railway_backup_production_github_actions"

          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$RAILWAY_SSH_PRIVATE_KEY_BASE64" | base64 --decode > "$railway_ssh_key"
          chmod 600 "$railway_ssh_key"
          ssh-keygen -y -f "$railway_ssh_key" > "$railway_ssh_key.pub"
          chmod 644 "$railway_ssh_key.pub"

          cleanup_railway_key() {
            rm -f "$railway_ssh_key" "$railway_ssh_key.pub"
          }
          trap cleanup_railway_key EXIT

          mkdir -p "$local_image_root"

          remote_listing="$(npx --yes @railway/cli@latest service files \
            --service esport-team-manager \
            --environment production \
            list "$private_image_root")"

          remote_file_count=0

          download_remote_directory() {
            local remote_directory="$1"
            local local_directory="$2"
            local directory_listing
            local remote_entry
            local directory_name

            mkdir -p "$local_directory"

            directory_listing="$(npx --yes @railway/cli@latest service files \
              --service esport-team-manager \
              --environment production \
              list "$remote_directory")"

            while IFS= read -r remote_entry; do
              if [ -z "$remote_entry" ]; then
                continue
              fi

              if [[ "$remote_entry" == */ ]]; then
                directory_name="${remote_entry%/}"
                download_remote_directory \
                  "$remote_directory/$directory_name" \
                  "$local_directory/$directory_name"
              else
                npx --yes @railway/cli@latest service files \
                  --service esport-team-manager \
                  --environment production \
                  download --overwrite \
                  "$remote_directory/$remote_entry" \
                  "$local_directory/$remote_entry"

                remote_file_count=$((remote_file_count + 1))
              fi
            done < <(printf '%s\n' "$directory_listing" | tr '[:space:]' '\n')
          }

          storage_category_count=0

          while IFS= read -r root_entry; do
            case "$root_entry" in
              team-logos/|strategy-images/)
                storage_category="${root_entry%/}"
                storage_category_count=$((storage_category_count + 1))

                printf 'Telechargement recursif de %s.\n' "$storage_category"

                download_remote_directory \
                  "$private_image_root/$storage_category" \
                  "$local_image_root/$storage_category"
                ;;
            esac
          done < <(printf '%s\n' "$remote_listing" | tr '[:space:]' '\n')

          if [ "$storage_category_count" -eq 0 ]; then
            printf "Aucun dossier de stockage applicatif attendu n'a ete detecte dans la liste Railway : %s\n" \
              "$remote_listing" >&2
            exit 1
          fi

          local_file_count="$(find "$local_image_root" -type f | wc -l)"

          if [ "$remote_file_count" -ne "$local_file_count" ]; then
            printf 'Le nombre de fichiers telecharges est different du nombre de fichiers distants : %s fichier(s) distant(s), %s fichier(s) local(aux).\n' \
              "$remote_file_count" "$local_file_count" >&2
            exit 1
          fi

          printf 'file_count=%s\n' "$local_file_count" >> "$GITHUB_OUTPUT"
          printf '%s fichier(s) prive(s) persistant(s) telecharge(s).\n' "$local_file_count"

      - name: Chiffrer et controler les sauvegardes
        shell: bash
        run: |
          backup_directory="${{ steps.metadata.outputs.backup_directory }}"

          cd "$backup_directory"

          sha256sum production.dump > production.dump.sha256
          find private-images -type f -print0 | sort --zero-terminated | xargs --null --no-run-if-empty sha256sum > private-images.sha256
          printf '%s\n' "${{ steps.private_images.outputs.file_count }}" > private-images.count

          printf "Creation de l'archive PostgreSQL.\n"
          tar --create --gzip \
            --file production-database.tar.gz \
            production.dump \
            production.dump.sha256

          printf "Creation de l'archive des images privees.\n"
          tar --create --gzip \
            --file production-private-images.tar.gz \
            private-images \
            private-images.sha256 \
            private-images.count

          for archive_name in production-database.tar.gz production-private-images.tar.gz; do
            encrypted_name="$archive_name.enc"
            verification_name="$archive_name.verification"

            printf 'Chiffrement authentifie de %s.\n' "$archive_name"
            node "$GITHUB_WORKSPACE/scripts/backup-encryption.mjs" \
              encrypt "$archive_name" "$encrypted_name"

            sha256sum "$encrypted_name" > "$encrypted_name.sha256"

            printf 'Dechiffrement de controle de %s.\n' "$archive_name"
            node "$GITHUB_WORKSPACE/scripts/backup-encryption.mjs" \
              decrypt "$encrypted_name" "$verification_name"

            if ! cmp --silent "$archive_name" "$verification_name"; then
              original_digest="$(sha256sum "$archive_name" | cut -d ' ' -f 1)"
              verification_digest="$(sha256sum "$verification_name" | cut -d ' ' -f 1)"
              printf "Le dechiffrement de controle de %s differe de l'archive originale. Empreinte originale : %s. Empreinte de controle : %s.\n" \
                "$archive_name" "$original_digest" "$verification_digest" >&2
              exit 1
            fi

            rm -f "$archive_name" "$verification_name"
          done

          rm -f production.dump production.dump.sha256 private-images.sha256 private-images.count
          rm -rf "$backup_directory/private-images"

      - name: Conserver la sauvegarde PostgreSQL pendant 30 jours
        uses: actions/upload-artifact@v6
        with:
          name: production-database-${{ steps.metadata.outputs.backup_id }}
          path: |
            ${{ steps.metadata.outputs.backup_directory }}/production-database.tar.gz.enc
            ${{ steps.metadata.outputs.backup_directory }}/production-database.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Conserver la sauvegarde des images pendant 30 jours
        uses: actions/upload-artifact@v6
        with:
          name: production-private-images-${{ steps.metadata.outputs.backup_id }}
          path: |
            ${{ steps.metadata.outputs.backup_directory }}/production-private-images.tar.gz.enc
            ${{ steps.metadata.outputs.backup_directory }}/production-private-images.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Resumer la sauvegarde
        shell: bash
        run: |
          {
            printf '### Sauvegarde de production reussie\n\n'
            printf -- '- Identifiant : %s\n' "${{ steps.metadata.outputs.backup_id }}"
            printf -- '- PostgreSQL : dump verifie, chiffre avec AES-256-GCM et conserve 30 jours.\n'
            printf -- '- Images privees : %s fichier(s) persistant(s) verifie(s), chiffre(s) avec AES-256-GCM et conserve(s) 30 jours.\n' "${{ steps.private_images.outputs.file_count }}"
            printf -- '- Stockages applicatifs inclus : team-logos et strategy-images.\n'
          } >> "$GITHUB_STEP_SUMMARY"
